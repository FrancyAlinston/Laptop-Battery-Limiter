# Universal Battery Limiter Cross-Platform CI/CD Pipeline
# Builds and tests for both Linux and Windows, creates packages for releases
# Supports automatic versioning and multi-platform distribution

name: Cross-Platform Build and Package

on:
  push:
    branches: [ "stable", "beta" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "stable", "beta" ]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.2.0)'
        required: false
        default: ''
      branch:
        description: 'Branch to release from (stable, beta)'
        required: false
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
      build_target:
        description: 'Build target'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows

permissions:
  contents: write
  packages: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    name: Test Linux Version

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-appindicator3-0.1 gir1.2-notify-0.7 python3-tk
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=debian-package,windows-version
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=debian-package,windows-version
    - name: Test scripts syntax
      run: |
        # Test shell scripts syntax
        bash -n battery-cli
        bash -n battery-limit
        bash -n set-charge-limit.sh
        bash -n install.sh
        bash -n uninstall.sh
        bash -n build-deb.sh
        # Test Python scripts syntax
        python3 -m py_compile battery-gui
        python3 -m py_compile battery-indicator
    - name: Test CLI functionality
      run: |
        # Test CLI help output
        ./battery-cli --help
        # Test battery limit script
        ./battery-limit --help

  test-windows:
    runs-on: windows-latest
    name: Test Windows Version
    
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install Windows dependencies
      run: |
        python -m pip install --upgrade pip
        cd windows-version
        pip install -r requirements.txt
    - name: Test Windows scripts syntax
      run: |
        cd windows-version
        python -m py_compile battery_limiter_windows.py
        python -m py_compile battery_cli.py
        python -m py_compile config_manager.py
        python -m py_compile create_installer.py
    - name: Test Windows CLI functionality
      run: |
        cd windows-version
        python battery_cli.py --help
        python battery_limiter_windows.py --help

  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag-exists: ${{ steps.check-tag.outputs.exists }}
    steps:
    - uses: actions/checkout@v4
    - name: Get version
      id: version
      run: |
        if [ "${{ github.event.inputs.version }}" != "" ]; then
          VERSION="${{ github.event.inputs.version }}"
        elif [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          # Get version from control file
          VERSION=$(grep "^Version:" debian-package/DEBIAN/control | cut -d' ' -f2)
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION"
    - name: Check if tag exists
      id: check-tag
      run: |
        if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

  build-deb:
    needs: [test-linux, get-version]
    runs-on: ubuntu-latest
    name: Build Linux .deb Package
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/beta'

    steps:
    - uses: actions/checkout@v4
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y dpkg-dev fakeroot devscripts
    - name: Update version in files
      run: |
        VERSION=${{ needs.get-version.outputs.version }}
        BRANCH_NAME=${GITHUB_REF#refs/heads/}

        echo "Building version: $VERSION"
        echo "Branch: $BRANCH_NAME"

        # Determine release type based on branch
        if [ "$BRANCH_NAME" = "stable" ]; then
          RELEASE_TYPE="stable"
        elif [ "$BRANCH_NAME" = "beta" ]; then
          RELEASE_TYPE="beta"
          VERSION="$VERSION-beta"
        else
          # For tags or manual dispatch, default to stable
          RELEASE_TYPE="stable"
        fi

        echo "Release type: $RELEASE_TYPE"
        echo "Final version: $VERSION"

        # Update version in control file
        sed -i "s/^Version:.*/Version: $VERSION/" debian-package/DEBIAN/control
        # Update version in scripts
        sed -i "s/current_version = \".*\"/current_version = \"$VERSION\"/" battery-indicator
        sed -i "s/VERSION=\".*\"/VERSION=\"$VERSION\"/" battery-cli battery-limit
    - name: Build .deb package
      run: |
        chmod +x build-deb.sh
        ./build-deb.sh
        # Rename the package to include the version
        VERSION=${{ needs.get-version.outputs.version }}
        mv universal-battery-limiter_*.deb universal-battery-limiter_${VERSION}_all.deb
    - name: Test .deb package
      run: |
        VERSION=${{ needs.get-version.outputs.version }}
        # Check package contents
        dpkg-deb -c universal-battery-limiter_${VERSION}_all.deb
        # Check package info
        dpkg-deb -I universal-battery-limiter_${VERSION}_all.deb
    - name: Upload .deb artifact
      uses: actions/upload-artifact@v4
      with:
        name: deb-package
        path: universal-battery-limiter_*.deb

  create-release:
    needs: [test-linux, test-windows, get-version, build-deb, build-windows]
    runs-on: ubuntu-latest
    name: Create GitHub Release
    if: github.event_name == 'workflow_dispatch' && needs.get-version.outputs.tag-exists == 'false'

    steps:
    - uses: actions/checkout@v4
    - name: Download .deb package
      uses: actions/download-artifact@v4
      with:
        name: deb-package
    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ needs.get-version.outputs.version }}
        name: Release v${{ needs.get-version.outputs.version }}
        body: |
          ## Universal Battery Limiter v${{ needs.get-version.outputs.version }}

          ### Installation

          **Ubuntu/Debian (Recommended):**
          ```bash
          wget https://github.com/${{ github.repository }}/releases/download/v${{ needs.get-version.outputs.version }}/universal-battery-limiter_${{ needs.get-version.outputs.version }}_all.deb
          sudo dpkg -i universal-battery-limiter_${{ needs.get-version.outputs.version }}_all.deb
          sudo apt-get install -f  # Install any missing dependencies
          ```

          **Manual Installation:**
          ```bash
          git clone https://github.com/${{ github.repository }}.git
          cd Battery-Limter
          chmod +x install.sh
          sudo ./install.sh
          ```

          ### Features
          - Professional CLI and GUI interface
          - System tray indicator with quick presets
          - Automatic update checking
          - Native Ubuntu package management integration
          - Professional installation and uninstallation
          - Universal compatibility with all laptop brands

          ### System Requirements
          - Ubuntu 20.04+ or Debian 11+
          - Compatible laptop with battery charging control support
          - Python 3.8+
          - GTK 3.0+

          For detailed installation instructions, see [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/INSTALL.md).
        draft: false
        prerelease: false
        files: |
          universal-battery-limiter_${{ needs.get-version.outputs.version }}_all.deb

  publish-ppa:
    needs: [test-linux, get-version, build-deb]
    runs-on: ubuntu-latest
    name: Publish to Ubuntu PPA
    if: github.event_name == 'release' && github.repository_owner == 'yourusername'  # Replace with your username
    # This job is disabled by default - enable it by setting up PPA secrets
    # See PUBLISHING.md for setup instructions

    steps:
    - uses: actions/checkout@v4
    - name: Setup PPA publishing
      if: false  # Enable this when PPA is configured
      run: |
        # Install PPA publishing tools
        sudo apt-get update
        sudo apt-get install -y devscripts dput-ng
        # Import GPG key (store as secret)
        echo "${{ secrets.PPA_GPG_KEY }}" | gpg --import
        # Configure dput for PPA
        echo "[ppa]" > ~/.dput.cf
        echo "fqdn = ppa.launchpad.net" >> ~/.dput.cf
        echo "method = ftp" >> ~/.dput.cf
        echo "incoming = ~${{ secrets.PPA_USER }}/ubuntu/ppa/" >> ~/.dput.cf
        echo "login = anonymous" >> ~/.dput.cf
    - name: Build source package for PPA
      if: false  # Enable this when PPA is configured
      run: |
        # Create source package for PPA
        VERSION=${{ needs.get-version.outputs.version }}
        # This would require proper debian/ directory structure for PPA
        # See PUBLISHING.md for detailed setup
        echo "PPA publishing not yet configured"

  build-windows:
    needs: [test-windows, get-version]
    runs-on: windows-latest
    name: Build Windows .exe Installer
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/stable' || github.ref == 'refs/heads/beta'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Update version in Windows files
      run: |
        $VERSION = "${{ needs.get-version.outputs.version }}"
        # Update version in setup.py
        (Get-Content windows-version/setup.py) -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$VERSION`"" | Set-Content windows-version/setup.py
        # Update version in config.json
        (Get-Content windows-version/config.json) -replace '"version": ".*"', "`"version`": `"$VERSION`"" | Set-Content windows-version/config.json
        # Update version in create_installer.py
        (Get-Content windows-version/create_installer.py) -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$VERSION`"" | Set-Content windows-version/create_installer.py
    - name: Install Windows build dependencies
      run: |
        python -m pip install --upgrade pip
        cd windows-version
        pip install PyInstaller>=5.0
        pip install -r requirements.txt
    - name: Install NSIS (for professional installer)
      run: |
        # Download and install NSIS
        $nsisUrl = "https://sourceforge.net/projects/nsis/files/NSIS%203/3.08/nsis-3.08-setup.exe/download"
        Invoke-WebRequest -Uri $nsisUrl -OutFile nsis-setup.exe
        Start-Process -FilePath nsis-setup.exe -ArgumentList "/S" -Wait
        # Add NSIS to PATH
        $nsisPath = "C:\Program Files (x86)\NSIS"
        $env:PATH += ";$nsisPath"
        echo "$nsisPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Build Windows executable and installer
      run: |
        cd windows-version
        python create_installer.py
    - name: Test Windows executable
      run: |
        cd windows-version
        if (Test-Path "dist/UniversalBatteryLimiter.exe") {
          Write-Host "✅ Main executable created successfully"
        } else {
          Write-Host "❌ Main executable not found"
          exit 1
        }
        if (Test-Path "dist/battery-cli.exe") {
          Write-Host "✅ CLI executable created successfully"
        } else {
          Write-Host "❌ CLI executable not found"
          exit 1
        }
    - name: Upload Windows executables
      uses: actions/upload-artifact@v4
      with:
        name: windows-executables
        path: |
          windows-version/dist/*.exe
          windows-version/*.exe
